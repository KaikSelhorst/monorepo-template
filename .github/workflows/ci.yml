name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "turbo.json"
      - "package.json"
      - "bun.lock"
      - "packages/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type:check

      - name: Lint
        run: bun run check

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            api:
              - 'apps/api/**'
              - 'packages/**'

      # =============== DEPLOY WEB (Vercel) ===============
      - name: Deploy Web to Vercel
        if: steps.changes.outputs.web == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd apps/web
          bunx vercel link --yes --project zomboid-web --token=$VERCEL_TOKEN
          bunx vercel build --prod --yes --token=$VERCEL_TOKEN
          bunx vercel deploy --prod --prebuilt --token=$VERCEL_TOKEN

      # =============== PUBLISH API (GHCR + Docker + --compile) ===============
      - name: Compile API for Alpine
        if: steps.changes.outputs.api == 'true'
        run: bun run build:alpine
        working-directory: apps/api

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.api == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        if: steps.changes.outputs.api == 'true'
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        if: steps.changes.outputs.api == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: steps.changes.outputs.api == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
