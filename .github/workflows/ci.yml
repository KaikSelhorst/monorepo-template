name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "turbo.json"
      - "package.json"
      - "packages/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # Atualizado

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'

      # =============== DEPLOY WEB (Vercel) ===============
      - name: Deploy Web to Vercel
        if: steps.changes.outputs.web == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd apps/web
          bunx vercel link --yes --project zomboid-web --token=$VERCEL_TOKEN
          bunx vercel build --prod --yes --token=$VERCEL_TOKEN
          bunx vercel deploy --prod --prebuilt --token=$VERCEL_TOKEN

      # =============== DEPLOY API (Fly.io + Docker + --compile) ===============
      - name: Deploy API to Fly.io
        if: steps.changes.outputs.api == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd apps/api
          bun run build:alpine
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"

          if ! fly apps list -t "$FLY_API_TOKEN" | grep -q "zomboid-api"; then
            fly apps create zomboid-api --org personal -t "$FLY_API_TOKEN"
          fi

          fly deploy -t "$FLY_API_TOKEN"

          for i in {1..6}; do
            sleep 10
            if curl -f https://zomboid-api.fly.dev/health; then
              echo "API OK!"
              exit 0
            fi
            echo "Tentativa $i/6..."
          done

          echo "Deploy falhou!"
          exit 1

      # =============== ROLLBACK AUTOMÁTICO ===============
      - name: Rollback API
        if: steps.changes.outputs.api == 'true' && failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd apps/api
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"

          # Pega versão anterior
          PREV_VERSION=$(fly releases --app zomboid-api --json -t "$FLY_API_TOKEN" | jq -r '.[1].ImageRef // empty')
          if [ -z "$PREV_VERSION" ]; then
            echo "Nenhuma versão anterior!"
            exit 1
          fi

          echo "Rolando back para versao $PREV_VERSION"
          fly deploy \
            --image $PREV_VERSION \
            --strategy immediate

          sleep 10
          curl -f https://zomboid-api.fly.dev/health || exit 1
