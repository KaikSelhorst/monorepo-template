name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "turbo.json"
      - "package.json"
      - "packages/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      # DETECÇÃO DE MUDANÇAS
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'

      # BUILD CONDICIONAL (só se necessário)
      - name: Build Web (if changed)
        if: steps.changes.outputs.web == 'true'
        run: bunx turbo run build --filter=web

      - name: Build API (if changed)
        if: steps.changes.outputs.api == 'true'
        run: bunx turbo run build --filter=api

      # DEPLOY WEB (com --prebuilt)
      - name: Deploy Web to Vercel
        if: steps.changes.outputs.web == 'true'
        run: |
          cd apps/web
          bunx vercel link --yes --project zomboid-web --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          bunx vercel --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
