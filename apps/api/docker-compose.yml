# I use high ports to avoid easy conflicts with other
# projects when running this docker-compose.
services:
  postgres:
    image: postgres:18
    container_name: postgres_zomboid_api
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zomboid_api
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_zomboid_api
    restart: always
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
