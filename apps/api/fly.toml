app = "zomboid-api"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    timeout = "2s"
